<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場報告書作成</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#1B4FD8;--blue2:#EEF3FF;--blue3:#C7D7FA;
  --dark:#0F1923;--mid:#3A4A5C;--sub:#6B7A8D;
  --bg:#F5F7FA;--card:#fff;
  --green:#16A34A;--green2:#DCFCE7;
  --red:#DC2626;--red2:#FEE2E2;
  --radius:14px;--radius-sm:10px;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--dark);min-height:100vh;}

#api-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.api-card{background:var(--card);border-radius:var(--radius);border:1.5px solid #E2E8F0;padding:32px 28px;max-width:420px;width:100%;}
.api-logo{font-size:40px;text-align:center;margin-bottom:12px;}
.api-title{font-size:22px;font-weight:900;color:var(--dark);text-align:center;margin-bottom:6px;}
.api-sub{font-size:13px;color:var(--sub);text-align:center;line-height:1.6;margin-bottom:24px;}
.api-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px;margin-bottom:6px;}
.api-input{width:100%;font-family:'Noto Sans JP',sans-serif;font-size:13px;border:1.5px solid #E2E8F0;border-radius:var(--radius-sm);padding:12px 14px;color:var(--dark);outline:none;margin-bottom:8px;transition:border-color .2s;}
.api-input:focus{border-color:var(--blue);}
.api-hint{font-size:11px;color:var(--sub);margin-bottom:20px;line-height:1.6;}
.api-hint a{color:var(--blue);}
.api-btn{width:100%;padding:14px;border:none;border-radius:var(--radius-sm);background:var(--blue);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
.api-error{font-size:12px;color:var(--red);margin-top:8px;display:none;}

#main-app{display:none;}
.nav{background:var(--blue);position:sticky;top:0;z-index:100;}
.nav-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;padding:0 16px;}
.nav-logo{font-size:16px;font-weight:900;color:#fff;padding:14px 0;flex:1;}
.nav-tabs{display:flex;}
.nav-tab{padding:14px 12px;font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:700;color:rgba(255,255,255,0.65);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;}
.nav-tab.active{color:#fff;border-bottom-color:#fff;}
.nav-key{font-size:11px;color:rgba(255,255,255,0.6);cursor:pointer;padding:14px 0 14px 10px;text-decoration:underline;}

.page{display:none;max-width:700px;margin:0 auto;padding:20px 16px 60px;}
.page.visible{display:block;}

.card{background:var(--card);border-radius:var(--radius);border:1.5px solid #E2E8F0;padding:20px;margin-bottom:16px;}
.card-title{font-size:13px;font-weight:700;color:var(--mid);letter-spacing:.5px;margin-bottom:14px;display:flex;align-items:center;gap:7px;}

/* Company Settings Card */
.company-card{border-color:var(--blue3);background:var(--blue2);}
.company-saved{font-size:10px;font-weight:700;color:var(--green);margin-left:auto;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:480px){.form-row{grid-template-columns:1fr;}}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1/-1;}
.form-label{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.5px;}
.form-input,.form-select,.form-textarea{font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:500;border:1.5px solid #E2E8F0;border-radius:var(--radius-sm);padding:10px 12px;background:#fff;color:var(--dark);transition:border-color .2s;outline:none;width:100%;}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue);}
.form-textarea{resize:vertical;min-height:70px;line-height:1.6;}

.area-item{border:1.5px solid #E2E8F0;border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;background:#FAFBFF;}
.area-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.area-title{font-size:12px;font-weight:700;color:var(--mid);}
.area-remove{border:none;background:none;color:#B0BAC9;cursor:pointer;font-size:20px;padding:0;line-height:1;}
.area-name-input{width:100%;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;border:1.5px solid #E2E8F0;border-radius:8px;padding:9px 12px;color:var(--dark);background:#fff;outline:none;margin-bottom:12px;}
.area-name-input:focus{border-color:var(--blue);}
.area-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:480px){.area-grid{grid-template-columns:1fr;}}
.ba-badge{font-size:11px;font-weight:800;padding:4px 12px;border-radius:50px;letter-spacing:.5px;display:inline-block;margin-bottom:8px;}
.ba-badge.before{background:var(--red2);color:var(--red);}
.ba-badge.after{background:var(--green2);color:var(--green);}
.ba-upload{border:2px dashed #E2E8F0;border-radius:var(--radius-sm);aspect-ratio:4/3;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;background:#FAFAFA;transition:all .2s;}
.ba-upload:hover{border-color:var(--blue);background:var(--blue2);}
.ba-upload input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.ba-preview{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:4/3;}
.ba-preview img{width:100%;height:100%;object-fit:cover;display:block;}
.ba-preview-remove{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.6);color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;}
.ba-preview-label{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;font-size:10px;font-weight:700;text-align:center;}
.ba-preview-label.before{background:rgba(220,38,38,0.85);color:#fff;}
.ba-preview-label.after{background:rgba(22,163,74,0.85);color:#fff;}
.desc-textarea{width:100%;font-family:'Noto Sans JP',sans-serif;font-size:12px;border:1.5px solid #E2E8F0;border-radius:8px;padding:8px 10px;color:var(--dark);background:#fff;outline:none;margin-top:8px;resize:vertical;min-height:60px;line-height:1.5;}
.desc-textarea:focus{border-color:var(--blue);}
.add-area-btn{width:100%;padding:11px;border:1.5px dashed var(--blue3);border-radius:var(--radius-sm);background:var(--blue2);color:var(--blue);font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px;}
.ai-desc-btn{width:100%;padding:10px;border:none;border-radius:var(--radius-sm);background:linear-gradient(135deg,#7C3AED,#1B4FD8);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .2s;}
.ai-desc-btn:hover{opacity:.85;}
.ai-desc-btn:disabled{opacity:.5;cursor:not-allowed;background:#B0BAC9;}

.gen-btn{width:100%;padding:16px;border:none;border-radius:var(--radius-sm);background:var(--blue);color:#fff;font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;transition:all .2s;}
.gen-btn:hover{background:#1640B8;}
.gen-btn:disabled{opacity:.5;cursor:not-allowed;}

.history-empty{text-align:center;padding:48px 20px;color:var(--sub);font-size:14px;}
.history-empty-icon{font-size:40px;margin-bottom:12px;}
.select-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-radius:var(--radius-sm);border:1.5px solid #E2E8F0;margin-bottom:12px;}
.select-bar-left{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--mid);cursor:pointer;}
.select-count{font-size:11px;color:var(--sub);}
.report-item{background:var(--card);border-radius:var(--radius);border:1.5px solid #E2E8F0;padding:16px 18px;margin-bottom:10px;transition:all .2s;}
.report-item.selected{border-color:var(--blue);background:var(--blue2);}
.report-item-row{display:flex;align-items:flex-start;gap:12px;}
.report-info{flex:1;}
.report-title{font-size:14px;font-weight:700;color:var(--dark);margin-bottom:3px;}
.report-meta{font-size:11px;color:var(--sub);margin-bottom:4px;}
.report-area-names{font-size:11px;color:var(--sub);}
.report-actions{display:flex;gap:6px;margin-top:10px;}
.small-btn{padding:5px 12px;border:1.5px solid #E2E8F0;border-radius:50px;background:#fff;font-family:'Noto Sans JP',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;}
.small-btn:hover{background:var(--blue2);border-color:var(--blue3);}
.small-btn.danger{color:var(--red);}
.small-btn.danger:hover{background:var(--red2);border-color:var(--red);}
.export-import-bar{display:flex;gap:8px;margin-bottom:12px;}
.loading-dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin:0 3px;animation:ld .9s infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes ld{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
</style>
</head>
<body>

<!-- API Screen -->
<div id="api-screen">
  <div class="api-card">
    <div class="api-logo">🏗️</div>
    <div class="api-title">現場報告書作成</div>
    <div class="api-sub">はじめにAnthropic APIキーを入力してください。<br>キーはこのブラウザにのみ保存されます。</div>
    <div class="api-label">APIキー</div>
    <input class="api-input" type="password" id="api-key-input" placeholder="sk-ant-api03-..." autocomplete="off">
    <div class="api-hint">APIキーは <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a> で取得できます。</div>
    <button class="api-btn" onclick="saveApiKey()">はじめる →</button>
    <div class="api-error" id="api-error"></div>
  </div>
</div>

<!-- Main App -->
<div id="main-app">
  <div class="nav">
    <div class="nav-inner">
      <div class="nav-logo">🏗️ 現場報告</div>
      <div class="nav-tabs">
        <button class="nav-tab active" id="tab-create" onclick="showPage('create')">作成</button>
        <button class="nav-tab" id="tab-history" onclick="showPage('history')">履歴</button>
      </div>
      <span class="nav-key" onclick="resetKey()">🔑</span>
    </div>
  </div>

  <!-- 作成ページ -->
  <div class="page visible" id="page-create">
    <div style="height:16px;"></div>

    <!-- 会社設定 -->
    <div class="card company-card">
      <div class="card-title">
        🏢 会社設定
        <span class="company-saved" id="company-saved-badge"></span>
      </div>
      <div class="form-row">
        <div class="form-group"><div class="form-label">自社名</div><input class="form-input" id="company-name" placeholder="例：○○清掃サービス株式会社" type="text" oninput="autoSaveCompany()"></div>
        <div class="form-group"><div class="form-label">電話番号（任意・PDF記載用）</div><input class="form-input" id="company-phone" placeholder="例：0586-00-0000" type="tel" oninput="autoSaveCompany()"></div>
      </div>
    </div>

    <!-- 物件・作業情報 -->
    <div class="card">
      <div class="card-title">🏠 物件・作業情報</div>
      <div class="form-row">
        <div class="form-group"><div class="form-label">物件名</div><input class="form-input" id="site-name" placeholder="例：トレ・パーチェ一宮" type="text"></div>
        <div class="form-group"><div class="form-label">作業日</div><input class="form-input" id="report-date" type="date"></div>
      </div>
      <div class="form-row">
        <div class="form-group full"><div class="form-label">所在地（任意）</div><input class="form-input" id="site-address" placeholder="例：愛知県一宮市○○町1-2-3" type="text"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><div class="form-label">作業種別</div>
          <select class="form-select" id="work-type">
            <option>定期清掃</option>
            <option>特別清掃</option>
            <option>緊急対応</option>
            <option>その他</option>
          </select>
        </div>
        <div class="form-group"><div class="form-label">次回清掃予定（任意）</div><input class="form-input" id="next-date" placeholder="例：2026年7月" type="text"></div>
      </div>
      <div class="form-row">
        <div class="form-group full"><div class="form-label">担当者名</div><input class="form-input" id="reporter" placeholder="例：檜垣" type="text"></div>
      </div>
    </div>

    <!-- 提出先（PDF記載用） -->
    <div class="card">
      <div class="card-title">📬 提出先（PDF記載用）</div>
      <div class="form-row">
        <div class="form-group full"><div class="form-label">管理会社名・宛先名</div><input class="form-input" id="recipient-name" placeholder="例：三和住宅株式会社 御中" type="text"></div>
      </div>
    </div>

    <!-- 施工箇所 -->
    <div class="card">
      <div class="card-title">🔨 施工前後の変化</div>
      <div id="areas-container"></div>
      <button class="add-area-btn" onclick="addArea()">＋ 箇所を追加</button>
    </div>

    <!-- 特記事項 -->
    <div class="card">
      <div class="card-title">📝 特記事項（任意）</div>
      <textarea class="form-textarea" id="notes" placeholder="例：各箇所とも大きな損傷等は確認されませんでした。"></textarea>
    </div>

    <button class="gen-btn" onclick="savePDF()">📄 PDF報告書を出力・保存</button>
  </div>

  <!-- 履歴ページ -->
  <div class="page" id="page-history">
    <div style="height:16px;"></div>
    <div class="export-import-bar">
      <button class="small-btn" onclick="exportReports()">📤 エクスポート</button>
      <label class="small-btn" style="cursor:pointer;">📥 インポート<input type="file" accept=".json" onchange="importReports(event)" style="display:none;"></label>
    </div>
    <div id="reports-list"></div>
  </div>
</div>

<script>
let areas = [];
let areaCounter = 0;
let saveTimer;

// --- API Key ---
function saveApiKey(){
  const key = document.getElementById('api-key-input').value.trim();
  const err = document.getElementById('api-error');
  if(!key || !key.startsWith('sk-')){err.style.display='block';err.textContent='正しいAPIキーを入力してください（sk- で始まります）';return;}
  localStorage.setItem('anthropic_api_key', key);
  document.getElementById('api-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  initApp();
}
function resetKey(){if(confirm('APIキーをリセットしますか？')){localStorage.removeItem('anthropic_api_key');location.reload();}}
document.getElementById('api-key-input').addEventListener('keydown', e=>{if(e.key==='Enter') saveApiKey();});

function initApp(){
  document.getElementById('report-date').value = new Date().toISOString().split('T')[0];
  loadCompanySettings();
  if(!areas.length) addArea();
}
// --- IndexedDB ---
let dbInstance = null;
function openDB(){
  if(dbInstance) return Promise.resolve(dbInstance);
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('genba_reports_v1',1);
    req.onupgradeneeded = e=>e.target.result.createObjectStore('reports',{keyPath:'id'});
    req.onsuccess = e=>{dbInstance=e.target.result;resolve(dbInstance);};
    req.onerror = ()=>reject(req.error);
  });
}
async function dbGetAll(){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const req = db.transaction('reports','readonly').objectStore('reports').getAll();
    req.onsuccess = ()=>resolve(req.result.sort((a,b)=>b.id-a.id));
    req.onerror = ()=>reject(req.error);
  });
}
async function dbPut(report){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('reports','readwrite');
    tx.objectStore('reports').put(report);
    tx.oncomplete = resolve;
    tx.onerror = ()=>reject(tx.error);
  });
}
async function dbDelete(id){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('reports','readwrite');
    tx.objectStore('reports').delete(id);
    tx.oncomplete = resolve;
    tx.onerror = ()=>reject(tx.error);
  });
}
async function migrateFromLocalStorage(){
  try{
    const raw = localStorage.getItem('reports');
    if(!raw) return;
    const old = JSON.parse(raw);
    if(!old.length){localStorage.removeItem('reports');return;}
    const existing = await dbGetAll();
    if(existing.length>0){localStorage.removeItem('reports');return;}
    for(const r of old) await dbPut(r);
    localStorage.removeItem('reports');
  }catch(e){}
}
window.onload = async ()=>{
  await migrateFromLocalStorage();
  if(localStorage.getItem('anthropic_api_key')){
    document.getElementById('api-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'block';
    initApp();
  }
};

// --- Company Settings ---
function getCompanySettings(){return JSON.parse(localStorage.getItem('company_settings') || '{}');}
function loadCompanySettings(){
  const s = getCompanySettings();
  if(s.name) document.getElementById('company-name').value = s.name;
  if(s.phone) document.getElementById('company-phone').value = s.phone;
  if(s.name || s.phone) document.getElementById('company-saved-badge').textContent = '✅ 保存済み';
}
function autoSaveCompany(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    const name = document.getElementById('company-name').value.trim();
    const phone = document.getElementById('company-phone').value.trim();
    localStorage.setItem('company_settings', JSON.stringify({name, phone}));
    const badge = document.getElementById('company-saved-badge');
    badge.textContent = '✅ 保存済み';
  }, 600);
}

// --- Nav ---
function showPage(p){
  ['create','history'].forEach(n=>{
    document.getElementById('page-'+n).classList.toggle('visible', n===p);
    document.getElementById('tab-'+n).classList.toggle('active', n===p);
  });
  if(p==='history') renderReports();
}

// --- Areas ---
function addArea(){
  const id = areaCounter++;
  areas.push({id, name:'', beforeImg:null, beforeDesc:'', afterImg:null, afterDesc:'', comment:'', isGenerating:false});
  renderAreas();
}
function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderAreas(){
  const c = document.getElementById('areas-container');
  if(!areas.length){c.innerHTML='';return;}
  c.innerHTML = areas.map((a, idx)=>`
    <div class="area-item">
      <div class="area-header">
        <div class="area-title">箇所 ${idx+1}</div>
        <button class="area-remove" onclick="removeArea(${a.id})">×</button>
      </div>
      <input class="area-name-input" type="text" placeholder="箇所名（例：駐車場部分）" value="${escHtml(a.name)}" oninput="updateAreaField(${a.id},'name',this.value)">
      <div class="area-grid">
        <div>
          <span class="ba-badge before">BEFORE</span>
          ${a.beforeImg
            ? `<div class="ba-preview"><img src="${a.beforeImg.dataUrl}"><button class="ba-preview-remove" onclick="clearImg(${a.id},'before')">✕</button><div class="ba-preview-label before">施工前</div></div>`
            : `<div class="ba-upload"><input type="file" accept="image/*" onchange="handleImg(event,${a.id},'before')"><div style="font-size:22px;margin-bottom:4px;">📷</div><div style="font-size:11px;font-weight:700;color:var(--sub);">施工前写真</div></div>`}
        </div>
        <div>
          <span class="ba-badge after">AFTER</span>
          ${a.afterImg
            ? `<div class="ba-preview"><img src="${a.afterImg.dataUrl}"><button class="ba-preview-remove" onclick="clearImg(${a.id},'after')">✕</button><div class="ba-preview-label after">施工後</div></div>`
            : `<div class="ba-upload"><input type="file" accept="image/*" onchange="handleImg(event,${a.id},'after')"><div style="font-size:22px;margin-bottom:4px;">📷</div><div style="font-size:11px;font-weight:700;color:var(--sub);">施工後写真</div></div>`}
        </div>
      </div>
      <textarea class="desc-textarea" placeholder="コメント（AIで自動生成、または手入力）500文字以内..." oninput="updateAreaField(${a.id},'comment',this.value)" maxlength="500">${escHtml(a.comment)}</textarea>
      ${a.isGenerating
        ? `<button class="ai-desc-btn" disabled>⏳ AIが写真を分析中...</button>`
        : `<button class="ai-desc-btn" onclick="generateAreaDescription(${a.id})" ${(!a.beforeImg && !a.afterImg) ? 'disabled' : ''}>✨ 写真からAIで説明文を自動生成</button>`
      }
    </div>`).join('');
}
function removeArea(id){areas = areas.filter(a=>a.id!==id); renderAreas();}
function updateAreaField(id, field, val){const a=areas.find(a=>a.id===id); if(a) a[field]=val;}
function compressImg(dataUrl, callback){
  const img = new Image();
  img.onload = function(){
    const maxSize = 1000;
    let w = img.width, h = img.height;
    if(w > maxSize || h > maxSize){
      if(w > h){h = Math.round(h * maxSize / w); w = maxSize;}
      else{w = Math.round(w * maxSize / h); h = maxSize;}
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', 0.75));
  };
  img.src = dataUrl;
}
function handleImg(e, id, type){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    compressImg(ev.target.result, compressed=>{
      const a = areas.find(a=>a.id===id);
      if(a){a[type+'Img']={base64:compressed.split(',')[1], dataUrl:compressed, mtype:'image/jpeg'}; renderAreas();}
    });
  };
  reader.readAsDataURL(file);
}
function clearImg(id, type){const a=areas.find(a=>a.id===id); if(a){a[type+'Img']=null; renderAreas();}}

// --- AI 説明文生成 ---
async function generateAreaDescription(id){
  const apiKey = localStorage.getItem('anthropic_api_key');
  if(!apiKey){resetKey();return;}
  const a = areas.find(a=>a.id===id);
  if(!a) return;
  if(!a.beforeImg && !a.afterImg){alert('写真を1枚以上追加してから押してください');return;}

  a.isGenerating = true;
  renderAreas();

  const content = [];
  if(a.beforeImg) content.push({type:'image', source:{type:'base64', media_type:a.beforeImg.mtype||'image/jpeg', data:a.beforeImg.base64}});
  if(a.afterImg)  content.push({type:'image', source:{type:'base64', media_type:a.afterImg.mtype||'image/jpeg',  data:a.afterImg.base64}});

  let promptText = '';
  if(a.beforeImg && a.afterImg){
    promptText = `清掃作業の施工前（1枚目）と施工後（2枚目）の写真です。写真を詳しく観察して、施工前の状況と施工後の改善内容をまとめた報告書用のコメントを作成してください。500文字以内、丁寧な文体で。必ず以下のJSON形式のみで返してください（他の文章は不要）:\n{"comment":"施工前後をまとめたコメント"}`;
  } else if(a.beforeImg){
    promptText = `清掃作業前の写真です。写真を見て施工前の状況を報告書用の丁寧な文体で説明してください。500文字以内で。必ず以下のJSON形式のみで返してください:\n{"comment":"施工前の状況の説明"}`;
  } else {
    promptText = `清掃作業後の写真です。写真を見て施工後の改善内容を報告書用の丁寧な文体で説明してください。500文字以内で。必ず以下のJSON形式のみで返してください:\n{"comment":"施工後の改善内容の説明"}`;
  }
  content.push({type:'text', text:promptText});

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:'claude-sonnet-4-20250514', max_tokens:600, messages:[{role:'user',content}]})
    });
    const data = await res.json();
    const text = data.content ? data.content.map(c=>c.text||'').join('') : '';
    const match = text.match(/\{[\s\S]*\}/);
    if(match){
      const parsed = JSON.parse(match[0]);
      if(parsed.comment) a.comment = parsed.comment;
    } else {
      alert('説明文の生成に失敗しました。もう一度お試しください。');
    }
  }catch(e){
    alert('エラーが発生しました。APIキーとネットワーク接続をご確認ください。');
  }

  a.isGenerating = false;
  renderAreas();
}

// --- Save & PDF ---
function savePDF(){
  const cs = getCompanySettings();
  const companyName = cs.name || '';
  const companyPhone = cs.phone || '';
  const siteName = document.getElementById('site-name').value.trim() || '物件名未入力';
  const siteAddress = document.getElementById('site-address').value.trim();
  const date = document.getElementById('report-date').value;
  const workType = document.getElementById('work-type').value;
  const nextDate = document.getElementById('next-date').value.trim();
  const reporter = document.getElementById('reporter').value.trim() || '担当者';
  const recipientName = document.getElementById('recipient-name').value.trim();
  const notes = document.getElementById('notes').value.trim();
  const dateStr = date ? new Date(date).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}) : '';

  const reportWithImages = {
    id: Date.now(), siteName, siteAddress, date, dateStr, workType, nextDate,
    reporter, companyName, companyPhone, recipientName, notes,
    savedAt: new Date().toISOString(),
    areas: areas.map(a=>({
      name: a.name,
      beforeImg: a.beforeImg ? {dataUrl: a.beforeImg.dataUrl} : null,
      afterImg: a.afterImg ? {dataUrl: a.afterImg.dataUrl} : null,
      beforeDesc: a.beforeDesc, afterDesc: a.afterDesc, comment: a.comment
    }))
  };

  openPrintWindow(reportWithImages);
  dbPut(reportWithImages).catch(()=>alert('保存に失敗しました。'));
  if(confirm('報告書を保存しました！フォームをリセットしますか？')) resetForm();
}

function resetForm(){
  document.getElementById('site-name').value = '';
  document.getElementById('site-address').value = '';
  document.getElementById('report-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('next-date').value = '';
  document.getElementById('reporter').value = '';
  document.getElementById('recipient-name').value = '';
  document.getElementById('notes').value = '';
  areas = []; areaCounter = 0; addArea();
}

async function renderReports(){
  const reports = await dbGetAll();
  const list = document.getElementById('reports-list');
  if(!reports.length){
    list.innerHTML = `<div class="history-empty"><div class="history-empty-icon">📋</div>まだ報告書がありません。<br>「作成」タブから報告書を作成してください。</div>`;
    return;
  }
  list.innerHTML = reports.map(r=>{
    const d = new Date(r.savedAt);
    const ds = d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    const areaNames = r.areas.map(a=>a.name||'（名称なし）').join('、');
    return `<div class="report-item" id="ri-${r.id}">
      <div class="report-info">
        <div class="report-title">🏠 ${r.siteName}　<span style="font-size:11px;font-weight:600;color:var(--blue);">${r.workType||''}</span></div>
        <div class="report-meta">📅 ${r.dateStr||r.date} ｜ 👤 ${r.reporter} ｜ 📍 ${r.areas.length}箇所</div>
        <div class="report-area-names">${areaNames}</div>
        <div class="report-actions">
          <button class="small-btn" onclick="rePDF(${r.id})">📄 PDF保存</button>
          <button class="small-btn danger" onclick="deleteReport(${r.id})">🗑️ 削除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function exportReports(){
  const reports = await dbGetAll();
  if(!reports.length){alert('エクスポートする報告書がありません。');return;}
  const blob = new Blob([JSON.stringify(reports)],{type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `genba_reports_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
async function importReports(e){
  const file = e.target.files[0]; if(!file) return;
  try{
    const reports = JSON.parse(await file.text());
    if(!Array.isArray(reports)) throw new Error();
    let count = 0;
    for(const r of reports){if(r.id && r.siteName){await dbPut(r);count++;}}
    alert(`${count}件の報告書をインポートしました。`);
    renderReports();
  }catch(err){
    alert('インポートに失敗しました。正しいエクスポートファイルを選択してください。');
  }
  e.target.value='';
}
async function deleteReport(id){
  if(!confirm('この報告書を削除しますか？')) return;
  await dbDelete(id);
  renderReports();
}
async function rePDF(id){
  const reports = await dbGetAll();
  const r = reports.find(r=>r.id===id);
  if(r) openPrintWindow(r);
}


// --- PDF Generation ---
function safeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\n/g,'<br>'); }

function buildReportHTML(r){
  const areasHTML = r.areas.map((a,idx)=>`
    <div class="pdf-area">
      <div class="pdf-area-title">▶ ${safeHtml(a.name)||`箇所${idx+1}`}</div>
      <table class="pdf-photo-table">
        <tr>
          <td class="pdf-photo-cell">
            <div class="pdf-ba-badge before">BEFORE　施工前</div>
            ${a.beforeImg ? `<img class="pdf-ba-img" src="${a.beforeImg.dataUrl}">` : '<div class="pdf-ba-no-img">写真なし</div>'}
          </td>
          <td class="pdf-photo-cell">
            <div class="pdf-ba-badge after">AFTER　施工後</div>
            ${a.afterImg ? `<img class="pdf-ba-img" src="${a.afterImg.dataUrl}">` : '<div class="pdf-ba-no-img">写真なし</div>'}
          </td>
        </tr>
      </table>
      ${(a.comment || a.beforeDesc || a.afterDesc) ? `<div class="pdf-area-comment">${safeHtml(a.comment || [a.beforeDesc, a.afterDesc].filter(Boolean).join('　'))}</div>` : ''}
    </div>`).join('');

  const infoRows = [
    ['物件名', safeHtml(r.siteName), '作業日', safeHtml(r.dateStr||r.date)],
    r.siteAddress ? ['所在地', `<td colspan="3" style="font-size:12px;">${safeHtml(r.siteAddress)}</td>`, null, null] : null,
    ['作業種別', safeHtml(r.workType||''), '次回予定', safeHtml(r.nextDate||'—')],
    ['担当業者', safeHtml(r.companyName||'—'), '担当者', safeHtml(r.reporter)],
  ].filter(Boolean);

  const infoTableRows = infoRows.map(row=>{
    if(row[2]===null) return `<tr><th>${row[0]}</th>${row[1]}</tr>`;
    return `<tr><th>${row[0]}</th><td>${row[1]}</td><th>${row[2]}</th><td>${row[3]}</td></tr>`;
  }).join('');

  return `<div class="pdf-page">
    <div class="pdf-top">
      <div class="pdf-title-area">
        <div class="pdf-main-title">${safeHtml(r.workType||'定期清掃')}作業報告書</div>
        <div class="pdf-report-date">報告日：${safeHtml(r.dateStr||r.date)}</div>
      </div>
      <div class="pdf-company-area">
        ${r.companyName ? `<div class="pdf-company-name">${safeHtml(r.companyName)}</div>` : ''}
        ${r.companyPhone ? `<div class="pdf-company-phone">TEL：${safeHtml(r.companyPhone)}</div>` : ''}
      </div>
    </div>

    <table class="pdf-info-table">${infoTableRows}</table>

    <div class="pdf-section">
      <div class="pdf-section-title">■ 施工前後の変化</div>
      ${areasHTML}
    </div>

    ${r.notes ? `<div class="pdf-section"><div class="pdf-section-title">■ 特記事項</div><div class="pdf-notes">${safeHtml(r.notes)}</div></div>` : ''}

    <div class="pdf-footer-block">
      <div class="pdf-footer-info">
        ${r.companyName ? `<div>担当業者：${safeHtml(r.companyName)}</div>` : ''}
        <div>担当者：${safeHtml(r.reporter)}</div>
        <div>報告日：${safeHtml(r.dateStr||r.date)}</div>
      </div>
      <div class="pdf-stamp-box"><div class="pdf-stamp-label">会社印</div></div>
    </div>
  </div>`;
}

function openPrintWindow(r){
  const css = `
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
    @page { size: A4 portrait; margin: 12mm 14mm; }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;background:#fff;}
    body{font-family:'Noto Sans JP',sans-serif;color:#0F1923;}
    .pdf-page{width:100%;}

    /* Header */
    .pdf-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;padding-bottom:12px;border-bottom:3px solid #1B4FD8;}
    .pdf-main-title{font-size:22px;font-weight:900;color:#1B4FD8;margin-bottom:4px;}
    .pdf-report-date{font-size:12px;color:#6B7A8D;}
    .pdf-company-area{text-align:right;}
    .pdf-company-name{font-size:14px;font-weight:700;color:#0F1923;}
    .pdf-company-phone{font-size:11px;color:#6B7A8D;margin-top:2px;}

    /* Info Table */
    .pdf-info-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12px;}
    .pdf-info-table th{background:#EEF3FF;color:#1B4FD8;font-weight:700;padding:7px 12px;border:1px solid #C7D7FA;width:84px;white-space:nowrap;}
    .pdf-info-table td{padding:7px 12px;border:1px solid #E2E8F0;color:#0F1923;}

    /* Sections */
    .pdf-section{margin-bottom:18px;}
    .pdf-section-title{font-size:13px;font-weight:700;color:#1B4FD8;border-left:4px solid #1B4FD8;padding-left:9px;margin-bottom:12px;}
    .pdf-area{margin-bottom:18px;padding-bottom:16px;border-bottom:1.5px solid #E2E8F0;}
    .pdf-area:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
    .pdf-area-title{font-size:12px;font-weight:700;color:#1B4FD8;margin-bottom:10px;padding:5px 12px;background:#EEF3FF;border-radius:4px;border-left:3px solid #1B4FD8;}
    .pdf-photo-table{width:100%;border-collapse:separate;border-spacing:12px 0;}
    .pdf-photo-cell{width:50%;vertical-align:top;padding:0;}
    .pdf-ba-badge{font-size:10px;font-weight:800;padding:3px 10px;border-radius:50px;display:inline-block;margin-bottom:6px;}
    .pdf-ba-badge.before{background:#FEE2E2;color:#DC2626;}
    .pdf-ba-badge.after{background:#DCFCE7;color:#16A34A;}
    .pdf-ba-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;border:1px solid #E2E8F0;}
    .pdf-ba-no-img{width:100%;aspect-ratio:4/3;background:#F5F5F5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#B0BAC9;}
    .pdf-photo-desc{font-size:12px;color:#3A4A5C;line-height:1.7;background:#FFF8F8;border:1px solid #FEE2E2;border-radius:0 0 6px 6px;padding:8px 10px;border-top:none;}
    .pdf-photo-desc-after{background:#F0FFF4;border-color:#DCFCE7;}
    .pdf-desc-label{font-size:10px;font-weight:800;color:#DC2626;}
    .pdf-desc-label.after{color:#16A34A;}
    .pdf-area-comment{font-size:12px;color:#3A4A5C;line-height:1.8;padding:10px 14px;background:#F8FAFC;border-radius:6px;border:1px solid #E2E8F0;margin-top:10px;}
    .pdf-notes{font-size:12px;color:#3A4A5C;line-height:1.8;padding:10px 14px;background:#F8FAFC;border-radius:6px;border:1px solid #E2E8F0;}

    /* Footer */
    .pdf-footer-block{display:flex;justify-content:space-between;align-items:flex-end;border-top:1.5px solid #E2E8F0;padding-top:12px;margin-top:16px;}
    .pdf-footer-info{font-size:11px;color:#6B7A8D;line-height:1.9;}
    .pdf-stamp-box{width:70px;height:70px;border:2px solid #B0BAC9;border-radius:4px;display:flex;align-items:center;justify-content:center;}
    .pdf-stamp-label{font-size:10px;color:#B0BAC9;font-weight:700;letter-spacing:1px;}

    @media print{
      body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    }
  `;

  const fitScript = `<scr`+`ipt>
  window.addEventListener('load', function(){
    window.focus();
    setTimeout(function(){ window.print(); }, 500);
  });
  <\/scr`+`ipt>`;

  const html = `<!DOCTYPE html><html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>${r.siteName} ${r.workType||''}報告書</title>
    <style>${css}</style>
  </head><body>${buildReportHTML(r)}${fitScript}</body></html>`;

  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const w = window.open(url, '_blank');
  if(w){
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
  } else {
    const a = document.createElement('a');
    a.href = url;
    a.download = `${r.siteName}_${r.workType||'報告書'}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
